[build]
  publish = "site"
  # Pure static site: no build step. results.json is produced offline by pipeline/run_analysis.py
  # and committed, so Netlify only serves files.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
